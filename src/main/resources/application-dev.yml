server:
  servlet:
    context-path: /dmatnet-auth

spring:
  application:
    name: dmatnet-authentication
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  datasource:
    url: jdbc:mysql://localhost:3306/dbauthentication
    username: root
    password: Tgb68789475
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
    platform: mysql
  
  # JWT
jwt:
  expiration: 900000
  signup:
    url: /autenticacao/auth
  
  # Actuator
management:
  endpoint:
    health:
      show-details: always
  prometheus:
    enabled: true
  web:
    exposure:
      include: prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      jvm: true
    tags:
      application: dmatnet-authentication
  
