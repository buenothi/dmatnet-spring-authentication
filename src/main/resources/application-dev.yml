server:
  servlet:
    context-path: /dmatnet-auth
  port: 9090

spring:
  application:
    name: dmatnet-authentication
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    open-in-view: false
  datasource:
    url: jdbc:mysql://localhost:3306/dbauthentication?useUnicode=true&characterEncoding=UTF-8
    username: root
    password: Tgb68789475
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      platform: mysql
  security:
    user:
      name: user1
      password: password
    oauth2:
      authorizationserver:
        client:
          messaging-client:
            registration:
              client-id: "messaging-client"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              redirect-uris:
                - "http://127.0.0.1:8080/login/oauth2/code/messaging-client-oidc"
                - "http://127.0.0.1:8080/authorized"
              post-logout-redirect-uris:
                - "http://127.0.0.1:8080/logged-out"
              scopes:
                - "openid"
                - "profile"
                - "message.read"
                - "message.write"
            require-authorization-consent: true
  
  # Actuator
management:
  endpoint:
    health:
      show-details: always
  prometheus:
    enabled: true
  web:
    exposure:
      include: prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      jvm: true
    tags:
      application: dmatnet-authentication

# Actuator - Info
info:
  app:
    name: "@project.name@"
    description: "@project.description@"
    version: "@project.version@"
    encoding: "@project.build.sourceEncoding@"
    java:
      version: "@java.version@"